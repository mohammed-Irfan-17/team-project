<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <form>
            <div>
            <h1>Login</h1>
            <label for="first" style="display: block;">Username</label>
            <input type="text"id="first"placeholder="Enter your user name"style="display: block;">
            </div>

            <div>
            <label for="second"style="display: block;">Password</label>
            <input type="password"id="second"placeholder="Enter your password" style="display: block;">
            </div>
            <button style="width: 100%;height: 38px;font-size: 19px;padding:10px;border-radius: 15px;font-weight: 600;color: rgb(235, 233, 237);background-color: blueviolet;">Login</button>
        </form>
      
    </div>
    
</body>
</html>
